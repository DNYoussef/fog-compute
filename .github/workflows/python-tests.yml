name: Python Tests & Contract Validation

on:
  push:
    branches: [ main, develop, 'integration/**' ]
  pull_request:
    branches: [ main, develop, 'integration/**' ]
  workflow_dispatch:

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements.txt

    - name: Run contract tests
      env:
        APP_ENV: development
        ALLOW_MOCKS: "true"
        SECRET_KEY: "ci-test-secret-key-for-contract-tests-32chars!"
        DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/fog_compute_test"
      run: |
        python -m pytest tests/contracts/ -v --tb=short -p no:cacheprovider --cov=src --cov-report=term -W error::RuntimeWarning

  quality-gate:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: SIN-032 - No mock/stub in production paths
      run: |
        python scripts/ci/check_prod_mocks.py

    - name: SIN-030 - No TODO/pass/placeholder in hot paths
      run: |
        python scripts/ci/check_placeholders.py

    - name: CI workflow failure-mode guard
      run: |
        python scripts/ci/check_workflow_guards.py

  fog-coverage:
    name: Fog Coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run fog test suite with coverage gate
      run: |
        python -m pytest src/fog/tests/test_coordinator.py -v --tb=short --cov=src/fog --cov-report=term-missing --cov-report=xml:tests/output/coverage/coverage.xml --cov-fail-under=25

  backend-unit:
    name: Backend Hermetic Regression Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-asyncio psutil pydantic

    - name: Run backend tests
      env:
        APP_ENV: development
        ALLOW_MOCKS: "true"
        SECRET_KEY: "ci-test-secret-key-32chars-minimum!!"
      run: |
        python -m pytest backend/tests/test_mesh_routes.py backend/tests/test_heartbeat_jitter.py backend/tests/test_control_plane.py backend/tests/test_fog_bridge_control_plane.py -v --tb=short -p no:cacheprovider --no-cov

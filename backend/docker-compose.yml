# Fogburst Coordinator Docker Compose
# FOGBURST-001: Complete deployment configuration
#
# Usage:
#   docker-compose up -d              # Start coordinator
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop coordinator
#   docker-compose down -v            # Stop and remove volumes

version: '3.8'

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    image: fogburst-coordinator:latest
    container_name: fogburst-coordinator
    restart: unless-stopped
    ports:
      - "8000:8000"    # HTTP API
      - "8443:8443"    # HTTPS API (TLS)
      - "5353:5353/udp" # mDNS discovery
    environment:
      - FOGBURST_DATA_DIR=/app/data
      - FOGBURST_LOG_DIR=/app/logs
      - FOGBURST_CERTS_DIR=/app/certs
      - FOGBURST_HOST=0.0.0.0
      - FOGBURST_PORT=8000
      - FOGBURST_ENABLE_TLS=true
      - FOGBURST_ENABLE_MDNS=true
      - DATABASE_URL=sqlite:///app/data/fogburst.db
    volumes:
      - fogburst-data:/app/data
      - fogburst-logs:/app/logs
      - fogburst-certs:/app/certs
    networks:
      - fogburst-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: fogburst-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fogburst-redis:/data
    networks:
      - fogburst-net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - full

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: fogburst-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fogburst-prometheus:/prometheus
    networks:
      - fogburst-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: fogburst-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=fogburst
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - fogburst-grafana:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - fogburst-net
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  fogburst-data:
    driver: local
  fogburst-logs:
    driver: local
  fogburst-certs:
    driver: local
  fogburst-redis:
    driver: local
  fogburst-prometheus:
    driver: local
  fogburst-grafana:
    driver: local

networks:
  fogburst-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

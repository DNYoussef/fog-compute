[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests/python

# Output options
# Coverage flags are NOT injected globally. Each CI job passes its own
# --cov scope and --cov-fail-under so the gate measures the package the
# job actually exercises (see .github/workflows/python-tests.yml).
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

# Coverage configuration
[coverage:run]
source = src/fog
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = tests/output/coverage/html

# Markers
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    slow: mark test as slow running
    benchmark: mark test as benchmark

# Asyncio configuration
asyncio_mode = auto

# Timeout
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
